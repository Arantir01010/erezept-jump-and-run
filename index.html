<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no + viewport-fit=cover: kein Pinch-Zoom mitten im Spiel,
         PWA-Vollbild reicht bis in die Rundungen/Notches (safe-area via CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06090f" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Leeres Favicon: verhindert den 404-Request (Dev-Konsole & Messe-Server-Log) -->
    <link rel="icon" href="data:," />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Das e-Rezept — Spiele dich durch die TI</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #06090f;
        height: 100%;
        overflow: hidden;
        /* Touch-Härtung: kein Scroll/Zoom durch Gesten, kein Gummiband-Effekt,
           keine Textauswahl und kein Tipp-Blitz beim Spielen auf Touchscreens */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* image-rendering steuert src/main.ts dynamisch (Phaser setzt es als
         Inline-Stil, CSS kaeme hier nie zum Zug): ganzzahlige Skalierung
         (Messe-TV 3x) -> pixelated, krumme Faktoren -> Browser-Glaettung. */
      body.kiosk {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
