# Baut das Spiel bei jedem Push auf main und veröffentlicht dist/ auf GitHub Pages.
# Live-URL: https://arantir01010.github.io/erezept-jump-and-run/
# (vite base './' macht den Build pfad-unabhängig — läuft unter jedem Unterpfad)
#
# Reihenfolge ist Absicht: test -> validate -> build. Die schnellste und
# aussagekräftigste Prüfung läuft zuerst, damit ein Fehler früh sichtbar wird.
name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Engine-Logik: Hülle, Sichtlogik, Eingabe, Compiler-Regeln, Verdrahtung
      - name: Tests
        run: npm test
      # Level + Configs + Kern-Schutz (SHA-256-Manifest)
      - name: Validierung
        run: npm run validate
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Nur veröffentlichen, wenn wirklich auf main gepusht wurde
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
