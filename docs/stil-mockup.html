function radial(sc,k,size){if(sc.textures.exists(k))return;
 const c=sc.textures.createCanvas(k,size,size),x=c.context;
 const g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
 g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.35,'rgba(255,255,255,0.35)');
 g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,size,size);c.refresh();}
function paperTex(sc,k){if(sc.textures.exists(k))return;
 const c=sc.textures.createCanvas(k,W,H),x=c.context;
 for(let i=0;i<26000;i++){const a=Math.random()*0.06;
  x.fillStyle=`rgba(${Math.random()<0.5?90:255},${Math.random()<0.5?70:250},${Math.random()<0.5?50:235},${a})`;
  x.fillRect(Math.random()*W,Math.random()*H,1,1);}c.refresh();}
